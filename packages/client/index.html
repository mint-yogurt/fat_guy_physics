<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fatguyphysics</title>
    <!-- Inline so the loading bar paints before the (large) script bundle arrives. -->
    <style>
      body {
        background: #0b0e13;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0e13;
        color: #e8f0f7;
        font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
        letter-spacing: 0.12em;
      }
      #loading[hidden] {
        display: none;
      }
      #loading-track {
        position: relative;
        width: min(320px, 70vw);
        height: 10px;
        overflow: hidden;
        border: 1px solid rgba(232, 240, 247, 0.4);
      }
      #loading-fill {
        height: 100%;
        width: 0;
        background: #2f6fb0;
        transition: width 0.15s ease-out;
      }
      /* Before the script arrives there is nothing to count, so the bar slides instead of filling. */
      #loading.indeterminate #loading-fill {
        position: absolute;
        width: 35%;
        transition: none;
        animation: loading-slide 1.2s ease-in-out infinite alternate;
      }
      @keyframes loading-slide {
        from {
          left: 0;
        }
        to {
          left: 65%;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="indeterminate">
      <div id="loading-label">LOADING...</div>
      <div id="loading-track"><div id="loading-fill"></div></div>
    </div>
    <canvas id="viewport"></canvas>
    <div id="overlay">
      <div id="stats" hidden></div>
      <div id="hint" hidden></div>
      <div id="crosshair" hidden></div>
      <div id="prompt" hidden></div>
      <!-- The full legend. Hidden for now; it moves to menu > controls. -->
      <div id="controls" hidden>
        <b>move</b> WASD · <b>jump</b> Space · <b>scoop</b> LMB · <b>chup</b> RMB<br />
        <b>pick up</b> E · <b>stick</b> LMB swing, hold RMB throw<br />
        <b>log</b> hold LMB bowl, hold RMB lob<br />
        <b>map</b> M · <b>ragball</b> R · <b>view</b> V · <b>fov</b> -/= · <b>slots</b> 1-8
      </div>
      <div id="hotbar"></div>
      <div id="item-controls"></div>
      <div id="map" hidden><canvas></canvas></div>
      <div id="inventory" hidden></div>
    </div>
    <div id="charcreate" hidden>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
