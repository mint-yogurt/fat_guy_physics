<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fatguyphysics</title>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="overlay">
      <div id="stats"></div>
      <div id="crosshair" hidden></div>
      <div id="prompt" hidden></div>
      <div id="controls">
        <b>move</b> WASD · <b>jump</b> Space · <b>scoop</b> LMB · <b>chup</b> RMB<br />
        <b>pick up</b> E · <b>stick</b> LMB swing, hold RMB throw<br />
        <b>ragball</b> R · <b>view</b> V · <b>fov</b> -/= · <b>slots</b> 1-8
      </div>
      <div id="hotbar"></div>
    </div>
    <div id="charcreate" hidden>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
